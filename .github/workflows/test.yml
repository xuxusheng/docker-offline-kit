name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一分支/tag 的新推送自动取消未完成的旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ---------- 真机 systemd 路径：runner 本体 ----------
  install-root:
    name: root 直装（真 systemd）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: pack 出正式安装器并安装（root 直装路径）
        run: |
          go run ./cmd/pack --archs x86_64
          sudo ./dist/installer-x86_64 --non-interactive --yes
      - name: 验证（含非 root 用户组闭环）
        run: |
          docker version
          docker compose version
          systemctl is-active docker containerd
          docker info --format 'Storage: {{.Driver}} | Cgroup: {{.CgroupVersion}}'
          getent group docker   # 安装器必须创建 docker 组
          sudo useradd -m -s /bin/bash -u 1600 dockuser
          sudo usermod -aG docker dockuser
          sudo -u dockuser sh -c 'sg docker -c "docker ps"'   # 组内非 root 可连 docker.sock

  # ---------- sudo 带密码路径 ----------
  install-sudo-pass:
    name: sudo 带密码（--sudo-pass）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: pack 出正式安装器
        run: go run ./cmd/pack --archs x86_64
      - name: 造带密码的 sudo 用户并安装
        run: |
          sudo useradd -m -s /bin/bash -u 1500 tester
          echo "tester:Test@1234" | sudo chpasswd
          echo "tester ALL=(ALL) ALL" | sudo tee /etc/sudoers.d/tester
          sudo chmod 755 /home/tester
          sudo install -m 755 dist/installer-x86_64 /tmp/installer
          sudo -u tester bash -c "echo Test@1234 | sudo -S true" # 预热校验
          sudo -u tester /tmp/installer --non-interactive --yes --sudo-pass Test@1234
      - name: 验证
        run: |
          docker version
          docker compose version
          systemctl is-active docker

  # ---------- su 兜底路径 ----------
  install-su:
    name: su 兜底（无 sudo）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: pack 出正式安装器 + 移除 sudo
        run: |
          go run ./cmd/pack --archs x86_64
          sudo apt-get update -qq && sudo apt-get install -y -qq expect
          sudo useradd -m -s /bin/bash -u 1501 tester
          echo "root:Root@1234" | sudo chpasswd
          sudo install -m 755 dist/installer-x86_64 /installer-x86_64
          # 最后一步才移除 sudo（本步之后不再用 sudo）
          sudo mv /usr/bin/sudo /usr/bin/sudo.bak
      - name: expect 驱动 su 路径（需 pty 输 root 密码）
        run: |
          cat > drive.exp <<'EXP'
          set timeout 300
          spawn su -s /bin/bash tester -c "/installer-x86_64 --non-interactive --yes --no-systemd --skip-doctor"
          expect {
            -re {(?i)密码|password} { send "Root@1234\r"; exp_continue }
            timeout { exit 2 }
            eof
          }
          EXP
          expect drive.exp
      - name: 验证
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version

  # ---------- 多发行版容器矩阵（nohup 路径）----------
  container-matrix:
    name: 容器档 ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - ubuntu:20.04
          - almalinux:8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: pack 出正式安装器
        run: go run ./cmd/pack --archs x86_64
      - name: 容器内安装（nohup 路径）
        run: |
          docker run --rm --privileged \
            -v "$PWD/dist/installer-x86_64:/installer:ro" ${{ matrix.image }} bash -ec '
            (apt-get update -qq && apt-get install -y -qq iptables xz-utils) || \
            (yum install -y -q iptables xz) || \
            (dnf install -y -q iptables xz) || true
            /installer --non-interactive --yes --no-systemd --skip-doctor 2>&1 | tail -8
            docker version --format "Docker {{.Server.Version}} ✓"
            docker compose version'

  # ---------- aarch64 原生 runner ----------
  arm64-native:
    name: aarch64 原生（真硬件）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: pack 出 aarch64 安装器并安装
        run: |
          go run ./cmd/pack --archs aarch64
          uname -m
          sudo ./dist/installer-aarch64 --non-interactive --yes
      - name: 验证
        run: |
          docker version --format 'Docker {{.Server.Version}} ({{.Server.Os}}/{{.Server.Arch}})'
          docker compose version

  # ---------- armv7 qemu 冒烟（业界标准档）----------
  armv7-qemu:
    name: armv7 qemu-user 档
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm,v7
      - name: armhf 容器内冒烟（版本+payload 解包）
        run: |
          go run ./cmd/pack --archs armhf
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD/dist:/kit:ro" debian:12 bash -ec '
            /kit/installer-armhf --version
            /kit/installer-armhf debug-extract /tmp/x
            ls /tmp/x/bin/dockerd /tmp/x/bin/docker /tmp/x/compose/docker-compose
            echo "armv7 冒烟 ✓"'


  openeuler-ci:
    name: 容器档 openeuler
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: pack 出正式安装器
        run: go run ./cmd/pack --archs x86_64
      - name: openEuler 容器内安装
        timeout-minutes: 8
        run: |
          docker run --rm --privileged \
            -v "$PWD/dist/installer-x86_64:/installer:ro" openeuler/openeuler:24.03-lts bash -ec $'dnf install -y -q iptables xz 2>/dev/null || true; /installer --non-interactive --yes --no-systemd --skip-doctor 2>&1 | tail -6; docker version --format "Docker {{.Server.Version}}:ok"; docker compose version'

  # ---------- 发布：全部测试通过后才执行（仅 tag 触发） ----------
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [install-root, install-sudo-pass, install-su, container-matrix, arm64-native, armv7-qemu]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: pack 全部架构 + universal
        run: go run ./cmd/pack --archs x86_64,aarch64,armhf

      - name: 收集产物（含 latest 别名）
        run: |
          mkdir -p release-out
          cp dist/installer-x86_64 dist/installer-aarch64 dist/installer-armhf release-out/
          cp release/*.run release/*.sha256 release-out/
          cp release/dok-installer-*-universal.run release-out/dok-installer-latest-universal.run
          ls -la release-out/

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            release-out/installer-x86_64
            release-out/installer-aarch64
            release-out/installer-armhf
            release-out/*.run
            release-out/*.sha256
          body: |
            ## Docker + Compose 离线安装器

            | 文件 | 适用 |
            |---|---|
            | `dok-installer-*-universal.run` | 通用（x86_64/aarch64/armhf 自动选择），推荐 |
            | `installer-x86_64` / `installer-aarch64` / `installer-armhf` | 单架构瘦身版 |

            ## 用法

            ```bash
            # 下载（或离线拷贝）到目标机后：
            sudo bash dok-installer-*.run
            # 自动：环境预检 → 提权（root/sudo/su）→ 安装 → 启动 → 自验
            ```

            验证完整性：universal 包内嵌 sha256 自校验；亦可核对同名 `.sha256` 文件。

  # ---------- rootless 回归（最关键：CI 目前唯一没守住的安装路径） ----------
  rootless-ci:
    name: rootless 用户态安装
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: pack 出安装器
        run: go run ./cmd/pack --archs x86_64

      - name: 准备无特权用户（uidmap/subuid/AppArmor/会话）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq uidmap >/dev/null 2>&1
          sudo useradd -m -s /bin/bash -u 1850 rluser
          echo "rluser:100000:65536" | sudo tee /etc/subuid >/dev/null
          echo "rluser:100000:65536" | sudo tee /etc/subgid >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mkdir -p /run/user/1850 && sudo chown rluser:rluser /run/user/1850 && sudo chmod 700 /run/user/1850

      - name: rootless 安装（无特权用户 + 自动降级路径）
        run: |
          DIST_PKG=$(ls dist/installer-x86_64)
          sudo cp "$DIST_PKG" /var/tmp/rlinstaller
          sudo chmod 755 /var/tmp/rlinstaller
          # 用 GNU screen/tmux 或 machinectl 给 rluser 建 systemd 用户会话
          which machinectl || sudo apt-get install -y -qq systemd-container >/dev/null 2>&1
          sudo machinectl shell rluser@ /bin/bash -lc '/var/tmp/rlinstaller --rootless --non-interactive --yes --skip-doctor 2>&1 | tail -8; echo EXIT=$?'
      - name: 验证 rootless docker
        run: |
          sudo machinectl shell rluser@ /bin/bash -lc 'export PATH=/home/rluser/.local/bin:$PATH; docker --context rootless version --format "Docker {{.Server.Version}} (rootless)"'
